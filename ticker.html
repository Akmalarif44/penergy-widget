<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE-PETRA Ticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --petra-red: #B41F2E;
    --petra-red-dark: #841720;
    --navy: #0C1B26;
    --navy-2: #142B3B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{font-family:'IBM Plex Sans', system-ui, sans-serif;}

  .ticker-wrap{
    position:relative; overflow:hidden;
    display:flex; align-items:stretch;
    background: linear-gradient(120deg, var(--petra-red) 0%, var(--petra-red-dark) 100%);
    border-radius:6px;
    box-shadow:0 3px 10px rgba(132,23,32,0.28);
  }
  .ticker-badge{
    flex-shrink:0; display:flex; align-items:center; gap:9px;
    background:var(--navy); color:#fff;
    font-family:'IBM Plex Mono'; font-size:13px; font-weight:700;
    letter-spacing:0.06em; text-transform:uppercase;
    padding:0 20px; white-space:nowrap; z-index:2;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    padding-right:30px;
  }
  .live-dot{width:8px;height:8px;border-radius:50%; background:#fff; animation:pulseDot 1.6s ease-in-out infinite; flex-shrink:0;}
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .ticker-viewport{flex:1; overflow:hidden; position:relative;}
  .ticker-track{
    display:flex; align-items:center; gap:0; height:100%;
    animation: scrollLeft var(--dur, 38s) linear infinite;
    will-change: transform;
  }
  .ticker-wrap:hover .ticker-track,
  .ticker-wrap:focus-within .ticker-track{ animation-play-state: paused; }
  @keyframes scrollLeft{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  .ticker-item{
    display:flex; align-items:center; gap:12px; flex-shrink:0;
    padding:18px 34px; white-space:nowrap;
    color:#fff; font-size:16px; text-decoration:none;
  }
  .ticker-item:hover{color:#FBE7E9;}
  .ticker-item .tag{
    font-family:'IBM Plex Mono'; font-size:11px; font-weight:700; letter-spacing:0.05em;
    text-transform:uppercase; color:#fff; background:rgba(255,255,255,0.20);
    padding:4px 10px; border-radius:12px; flex-shrink:0;
  }
  .ticker-sep{width:1px; height:18px; background:rgba(255,255,255,0.25); flex-shrink:0;}

  @media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } }
  @media (max-width:560px){
    .ticker-badge{padding:0 14px 0 14px; padding-right:22px; font-size:11px;}
    .ticker-item{padding:14px 22px; font-size:13px;}
  }
</style>
</head>
<body>

<div class="ticker-wrap" id="tickerWrap">
  <span class="ticker-badge"><span class="live-dot"></span>Latest</span>
  <div class="ticker-viewport">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
</div>

<script>
/* ===========================================================
   LIVE CONTENT MODE
   Items are now fetched from items.json (same repo/folder as
   this file, served via GitHub Pages) instead of being
   hardcoded here. To update the ticker, edit items.json and
   push to GitHub — no need to touch this file or SharePoint.
=========================================================== */

const ITEMS_URL = "items.json"; // relative path — assumes same folder on GitHub Pages
const DURATION_SECONDS = 20;    // lower = faster scroll
const REFRESH_INTERVAL_MS = 5 * 60 * 1000; // re-check items.json every 5 min

// Fallback content shown only if the fetch fails (network issue,
// GitHub Pages down, CORS block from within the SharePoint iframe, etc.)
const FALLBACK_ITEMS = [
  { tag: "Notice", text: "Live feed unavailable — showing cached content.", href: "#" }
];

function buildTrackHTML(items){
  return items.map(i => `
    <a class="ticker-item" href="${i.href || '#'}">
      <span class="tag">${escapeHTML(i.tag)}</span>
      <span>${escapeHTML(i.text)}</span>
    </a>
    <span class="ticker-sep"></span>
  `).join('');
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}

async function fetchItems(){
  const res = await fetch(ITEMS_URL + '?_=' + Date.now(), { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if(!Array.isArray(data) || data.length === 0) throw new Error('Empty or invalid items.json');
  return data;
}

async function render(){
  const track = document.getElementById('tickerTrack');
  let items;
  try {
    items = await fetchItems();
  } catch (err) {
    console.warn('[ticker] falling back to static content:', err.message);
    items = FALLBACK_ITEMS;
  }
  const html = buildTrackHTML(items);
  track.innerHTML = html + html; // duplicate so the scroll loop is seamless
  track.style.setProperty('--dur', DURATION_SECONDS + 's');
}

render();
setInterval(render, REFRESH_INTERVAL_MS); // auto-refresh without reloading the SharePoint page
</script>

</body>
</html>
