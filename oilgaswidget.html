<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O&amp;G Trending News</title>
<!--
  Photo credits (Pexels License — free to use, attribution appreciated):
    Aron Razif ............ offshore platforms, Sarawak Malaysia
    Jakub Pabis ........... refinery plant & tanker wagons, Trzebinia
    Matheus Bertelli ...... conference speaker
    RDNE Stock project .... corporate presentation
    Quang Nguyen Vinh ..... solar + wind farm
    Lio Voo ............... barge and tugboats
    Heru Dharma ........... offshore rig with supply vessel
  Full list: https://www.pexels.com/license/
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;overflow:hidden;}
  body{
    font-family:"Segoe UI","Segoe UI Web (West European)",Segoe,
                -apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  :root{
    --inset:32px;
    --cap-bottom:58px;
    --dots-bottom:20px;
    --title:28px;
  }

  .car{position:relative;width:100%;height:100%;overflow:hidden;background:#0a1a20;}

  .track{display:flex;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);}
  @media (prefers-reduced-motion:reduce){.track{transition:none;}}

  .slide{
    min-width:100%;flex-shrink:0;height:100%;position:relative;
    display:block;text-decoration:none;color:inherit;
  }
  .slide img{
    width:100%;height:100%;
    object-fit:cover;object-position:center;
    display:block;background:#0a1a20;
  }
  .slide::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,
      rgba(0,0,0,.86) 0%,
      rgba(0,0,0,.58) 24%,
      rgba(0,0,0,.16) 50%,
      rgba(0,0,0,0) 74%);
  }

  /* ---------- CAPTION ---------- */
  .cap{
    position:absolute;
    left:var(--inset);right:var(--inset);bottom:var(--cap-bottom);
    z-index:2;color:#fff;pointer-events:none;
    max-width:calc(100% - (var(--inset) * 2));
  }
  .cap h2{
    font-size:var(--title);font-weight:600;line-height:1.25;letter-spacing:-.012em;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cap .meta{
    margin-top:8px;font-size:13px;font-weight:400;line-height:1;
    color:rgba(255,255,255,.82);text-shadow:0 1px 2px rgba(0,0,0,.45);
  }
  .cap .meta .sep{margin:0 7px;opacity:.55;}

  @media (min-width:900px){ .cap{max-width:66%;} }

  /* ---------- ARROWS ---------- */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:40px;height:40px;border:none;border-radius:50%;
    background:rgba(0,0,0,.45);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s ease,background .15s ease;
  }
  .car:hover .nav,.nav:focus-visible{opacity:1;}
  .nav:hover{background:rgba(0,0,0,.74);}
  .nav:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .nav.prev{left:20px;} .nav.next{right:20px;}
  .nav svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;
           stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- DOTS ---------- */
  .dots{
    position:absolute;left:0;right:0;bottom:var(--dots-bottom);z-index:3;
    display:flex;justify-content:center;align-items:center;gap:8px;
    height:8px;line-height:0;
  }
  .dot{
    width:8px;height:8px;padding:0;border:none;border-radius:50%;
    background:rgba(255,255,255,.42);cursor:pointer;flex:0 0 auto;
    transition:background .15s ease,transform .15s ease;
  }
  .dot:hover{background:rgba(255,255,255,.85);}
  .dot.active{background:#fff;transform:scale(1.3);}
  .dot:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  /* ---------- MOBILE ---------- */
  @media (max-width:640px){
    :root{--inset:20px;--cap-bottom:46px;--dots-bottom:16px;--title:18px;}
    .cap .meta{font-size:11px;margin-top:6px;}
    .nav{width:32px;height:32px;opacity:1;}
    .nav.prev{left:8px;} .nav.next{right:8px;}
    .dot{width:6px;height:6px;}
  }
</style>
</head>
<body>

<div class="car" id="car" role="region" aria-roledescription="carousel" aria-label="O&amp;G trending news">
  <div class="track" id="track" aria-live="polite"></div>

  <button class="nav prev" id="prev" aria-label="Previous news">
    <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
  </button>
  <button class="nav next" id="next" aria-label="Next news">
    <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
  </button>

  <div class="dots" id="dots" role="tablist" aria-label="Choose news item"></div>
</div>

<script>
/* =====================================================================
   SETTINGS
   ===================================================================== */
var SLIDE_MS     = 10000;  /* 10s per slide. 0 = manual only */
var EDITION_HOUR = 7;      /* new edition rotates in at 07:00 local time */
var IMG_WIDTH    = 1920;   /* HD. bump to 2560 for large TV displays */

/* =====================================================================
   PHOTOS — Pexels IDs. Change a photo by swapping its number.
   Browse pexels.com, open a photo, the number at the end of the URL is
   the ID:  pexels.com/photo/oil-refinery-plant-15970032/  ->  15970032
   ===================================================================== */
function px(id){
  return 'https://images.pexels.com/photos/' + id + '/pexels-photo-' + id +
         '.jpeg?auto=compress&cs=tinysrgb&w=' + IMG_WIDTH;
}

/* =====================================================================
   FALLBACK ARTWORK — used only if a photo fails to load (proxy block,
   Pexels down, wrong ID). Keeps the carousel looking finished.
   ===================================================================== */
var PALETTE = {
  teal:['#062229','#10454F'], navy:['#0D172B','#22304F'], red:['#2B0A0F','#661320'],
  slate:['#101416','#2A3136'], ocean:['#07202B','#0E3A46'], moss:['#0B211A','#164237']
};
var MOTIF = {
  derrick:'M100 26 L58 172 M100 26 L142 172 M70 132 H130 M78 102 H122 M86 72 H114 M46 172 H154 M100 26 V10',
  platform:'M22 118 H178 M22 118 L34 104 H166 L178 118 M42 118 V176 M158 118 V176 M74 118 V176 M126 118 V176 M22 176 H178 M104 104 V54 M88 54 H120 M104 54 L104 38',
  expo:'M24 60 H176 M24 60 V50 H176 V60 M40 60 V140 H88 V60 M112 60 V140 H160 V60 M24 168 H176 M52 92 H76 M136 92 H160 M52 116 H76 M136 116 H160',
  transition:'M34 156 L62 92 H150 L122 156 Z M56 118 H136 M78 92 L64 156 M104 92 L94 156 M162 40 m-10 0 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0 M162 40 V6 M162 40 L192 58 M162 40 L132 58 M162 50 V176',
  chart:'M28 172 H180 M42 172 V118 H70 V172 M84 172 V86 H112 V172 M126 172 V50 H154 V172 M28 172 V28',
  wellhead:'M100 18 V132 M84 132 H116 L100 178 Z M66 56 H134 M66 88 H134 M100 132 m-28 0 a28 28 0 1 0 56 0 M44 178 H156',
  hybrid:'M100 44 m-18 0 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0 M100 12 V22 M100 66 V76 M68 44 H58 M142 44 H132 M30 168 L56 112 H162 L136 168 Z M52 140 H146 M78 112 L66 168 M110 112 L102 168',
  tanker:'M24 112 H180 L160 154 H44 Z M100 112 V56 M100 56 H144 M56 112 V84 H84 V112 M118 112 V90 H144 V112 M12 166 H192 M32 166 Q50 158 68 166 T104 166 T140 166 T176 166',
  pipeline:'M12 82 H188 M12 130 H188 M46 74 V90 M96 74 V90 M146 74 V90 M46 122 V138 M96 122 V138 M146 122 V138 M96 90 V122 M96 106 m-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0 M96 90 V70'
};

function art(paletteName, motifName){
  var p = PALETTE[paletteName] || PALETTE.teal;
  var d = MOTIF[motifName] || MOTIF.derrick;
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + p[0] + '"/><stop offset="1" stop-color="' + p[1] + '"/>' +
      '</linearGradient>' +
      '<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">' +
        '<path d="M0 80 H80 M80 0 V80" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>' +
      '</pattern></defs>' +
      '<rect width="1600" height="900" fill="url(#g)"/>' +
      '<rect width="1600" height="900" fill="url(#grid)"/>' +
      '<circle cx="1290" cy="300" r="330" fill="#fff" fill-opacity=".035"/>' +
      '<g transform="translate(1010 150) scale(3.1)" fill="none" stroke="#fff" stroke-opacity=".30" ' +
         'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></g>' +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* =====================================================================
   CONTENT POOL — day 0 order. Rotates one position every morning at 07:00.
   ===================================================================== */
var POOL = [
  {title:'MOGSC 2026 — Malaysia O&G Services Sector Outlook',
   source:'MOGSC', link:'https://www.mogsc.org',
   photo:9336586,  palette:'teal',  motif:'platform'},   /* offshore platforms, Sarawak */

  {title:'PETRONAS Awards New Upstream Contracts in Malaysia',
   source:'PETRONAS', link:'https://www.petronas.com/media/press-release',
   photo:9336590,  palette:'ocean', motif:'platform'},   /* drone, platform complex */

  {title:'Malaysia Oil & Gas Sector Targets RM 30B Revenue in 2026',
   source:'MOGSC', link:'https://www.mogsc.org',
   photo:15970032, palette:'red',   motif:'chart'},      /* refinery + pipelines */

  {title:'MUPEX 2026 — Upstream Petroleum Exhibition Preview',
   source:'MUPEX', link:'https://www.mupex.com.my',
   photo:29708266, palette:'navy',  motif:'expo'},       /* conference speaker */

  {title:'OGA 2026 Conference Highlights Malaysia Energy Transition',
   source:'OGA', link:'https://www.ogashow.com',
   photo:35105427, palette:'moss',  motif:'transition'}, /* solar + wind, sunrise */

  {title:'Malaysian Oil Services Companies Report Strong Q2 2026 Results',
   source:'Bursa Malaysia', link:'https://www.bursamalaysia.com',
   photo:7648050,  palette:'slate', motif:'chart'},      /* corporate briefing */

  {title:'Sarawak Onshore Production Milestone — AKW First Oil Achieved',
   source:'Upstream', link:'https://www.petronas.com',
   photo:15970028, palette:'teal',  motif:'wellhead'},   /* onshore facility, rail loading */

  {title:'Malaysia Advances Renewable Energy Integration in Offshore Operations',
   source:'MOGSC', link:'https://www.mogsc.org',
   photo:35259449, palette:'moss',  motif:'hybrid'},     /* plant + turbine + solar */

  {title:'Asia Pacific LNG Demand Growth Supports Malaysia Upstream Investment',
   source:'PETRONAS', link:'https://www.petronas.com',
   photo:13178759, palette:'ocean', motif:'tanker'},     /* barge + tugboats at sea */

  {title:'PETRONAS Carigali Expands HUC Contracts for Malaysia Shelf Projects',
   source:'PETRONAS', link:'https://www.petronas.com/media/press-release',
   photo:36594202, palette:'navy',  motif:'pipeline'}    /* rig + supply vessel */
];

/* =====================================================================
   EDITION — the day flips at EDITION_HOUR, not midnight.
   ===================================================================== */
function editionDay(){
  var s = new Date(Date.now() - EDITION_HOUR * 3600000);
  return Math.floor(Date.UTC(s.getFullYear(), s.getMonth(), s.getDate()) / 86400000);
}
function todaysDeck(){
  var off = ((editionDay() % POOL.length) + POOL.length) % POOL.length;
  return POOL.slice(off).concat(POOL.slice(0, off));
}
function freshness(pos){
  if(pos === 0) return 'Just now';
  if(pos === 1) return 'Yesterday';
  if(pos < 7)  return pos + 'd ago';
  return Math.floor(pos / 7) + 'w ago';
}

/* =====================================================================
   ENGINE
   ===================================================================== */
var track  = document.getElementById('track');
var dotsEl = document.getElementById('dots');
var car    = document.getElementById('car');
var idx = 0, timer = null, dots = [], deck = [], currentEdition = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function render(){
  stop();
  currentEdition = editionDay();
  deck = todaysDeck();
  track.innerHTML = '';
  dotsEl.innerHTML = '';

  deck.forEach(function(it,i){
    var a = document.createElement('a');
    a.className = 'slide';
    a.href = it.link || '#';
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('role','group');
    a.setAttribute('aria-roledescription','slide');
    a.setAttribute('aria-label', (i+1) + ' of ' + deck.length);

    var img = document.createElement('img');
    img.alt = '';
    img.loading = i ? 'lazy' : 'eager';
    img.src = it.photo ? px(it.photo) : art(it.palette, it.motif);
    img.addEventListener('error', function(){
      img.src = art(it.palette, it.motif);      /* photo blocked or missing */
    }, {once:true});

    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.innerHTML = '<h2>' + esc(it.title) + '</h2>'
                  + '<div class="meta">' + esc(it.source)
                  + '<span class="sep">&middot;</span>' + freshness(i) + '</div>';

    a.appendChild(img);
    a.appendChild(cap);
    track.appendChild(a);

    var d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('role','tab');
    d.setAttribute('aria-label','News ' + (i+1));
    d.dataset.i = i;
    dotsEl.appendChild(d);
  });

  dots = [].slice.call(dotsEl.children);
  track.style.transition = 'none';
  goTo(0);
  void track.offsetWidth;
  track.style.transition = '';
  start();
}

function goTo(n){
  idx = (n + deck.length) % deck.length;
  track.style.transform = 'translateX(-' + (idx * 100) + '%)';
  dots.forEach(function(d,i){
    d.classList.toggle('active', i === idx);
    d.setAttribute('aria-selected', i === idx ? 'true' : 'false');
  });
}
function move(dir){ goTo(idx + dir); restart(); }

function start(){
  if(!SLIDE_MS || deck.length < 2) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  timer = setInterval(function(){ goTo(idx + 1); }, SLIDE_MS);
}
function stop(){ clearInterval(timer); timer = null; }
function restart(){ stop(); start(); }

dotsEl.addEventListener('click', function(e){
  var b = e.target.closest('.dot');
  if(b){ goTo(+b.dataset.i); restart(); }
});
document.getElementById('prev').addEventListener('click', function(){ move(-1); });
document.getElementById('next').addEventListener('click', function(){ move(1); });

car.addEventListener('mouseenter', stop);
car.addEventListener('mouseleave', start);
car.addEventListener('focusin', stop);
car.addEventListener('focusout', start);
car.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'ArrowLeft')  move(-1);
});

var x0 = null;
car.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; stop(); }, {passive:true});
car.addEventListener('touchend', function(e){
  if(x0 === null) return;
  var dx = e.changedTouches[0].clientX - x0;
  if(Math.abs(dx) > 45) goTo(idx + (dx < 0 ? 1 : -1));
  x0 = null; start();
}, {passive:true});

document.addEventListener('visibilitychange', function(){
  if(document.hidden){ stop(); return; }
  editionDay() !== currentEdition ? render() : start();
});
setInterval(function(){
  if(editionDay() !== currentEdition) render();
}, 60000);

render();
</script>
</body>
</html>
