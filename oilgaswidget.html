<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group IT — Oil &amp; Gas industry news</title>
<style>
  :root{
    --paper:#ffffff;
    --ink:#241a1c;
    --ink-soft:#8a7477;
    --red:#7a1220;
    --red-bright:#9e1b2e;
    --green:#0f6b3f;
    --line:#e3d7d9;
    --panel:#fbf5f6;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .panel{
    height:100%;
    padding:16px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
  }
  .head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-shrink:0;
  }
  .label{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0;
  }
  .stamp{
    font-size:10px;
    color:var(--ink-soft);
    margin:3px 0 0 13px;
  }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:#2fae5c;
    box-shadow:0 0 0 3px rgba(47,174,92,0.18);
    flex-shrink:0;
  }
  .head-right{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .mogsc-link{
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--red);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:5px;
    padding:3px 7px;
    transition:background .15s, border-color .15s;
  }
  .mogsc-link:hover{ background:#fdeef0; border-color:var(--red); }
  .refresh{
    border:0;
    background:none;
    cursor:pointer;
    color:var(--ink-soft);
    padding:4px;
    border-radius:6px;
    display:grid;
    place-items:center;
    transition:background .15s, color .15s;
  }
  .refresh:hover{ background:var(--panel); color:var(--red); }
  .refresh svg{ width:14px; height:14px; }
  .refresh.spin svg{ animation:spin .7s linear; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .scroll{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-right:2px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .scroll::-webkit-scrollbar{ display:none; }

  /* --- hero carousel --- */
  .hero{
    position:relative;
    flex-shrink:0;
    height:150px;
    border-radius:10px;
    overflow:hidden;
    background:var(--red);
  }
  .hero-slide{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .55s ease;
  }
  .hero-slide.active{ opacity:1; pointer-events:auto; }
  .hero-img{
    position:absolute; inset:0;
    background:center/cover no-repeat;
    /* keeps large source images crisp when the browser downscales */
    image-rendering:auto;
    transform:scale(1);
    transition:transform 6s ease;
  }
  .hero-slide.active .hero-img{ transform:scale(1.06); }
  .hero-slide::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(20,10,12,0.88) 0%, rgba(20,10,12,0.32) 48%, transparent 75%);
  }
  .hero-tag{
    position:absolute;
    top:10px; left:10px;
    background:var(--red);
    color:#fff;
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:5px;
    z-index:1;
  }
  .hero-tag.local{ background:var(--green); }
  .hero-body{
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 12px;
    color:#fff;
    text-decoration:none;
  }
  .hero-title{
    font-size:14px;
    font-weight:700;
    line-height:1.3;
    margin:0 0 4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .hero-meta{
    font-size:10.5px;
    color:rgba(255,255,255,0.85);
    font-weight:600;
  }
  .hero-dots{
    position:absolute;
    bottom:9px; right:11px;
    display:flex;
    gap:5px;
    z-index:2;
  }
  .hero-dots button{
    width:6px; height:6px;
    padding:0;
    border:0;
    border-radius:3px;
    background:rgba(255,255,255,0.45);
    cursor:pointer;
    transition:width .2s, background .2s;
  }
  .hero-dots button.active{
    width:16px;
    background:#fff;
  }

  .sub-label{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0;
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  a.card{
    display:flex;
    flex-direction:column;
    border-radius:8px;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s, background .15s;
    opacity:0;
    animation:tile-in .4s ease forwards;
    animation-delay:calc(var(--i, 0) * 60ms + 60ms);
  }
  a.card:hover{
    border-color:var(--red);
    background:#fdeef0;
  }
  .card-img{
    position:relative;
    height:64px;
    background:var(--red) center/cover no-repeat;
    display:grid;
    place-items:center;
    flex-shrink:0;
  }
  .card-img svg{ width:18px; height:18px; opacity:0.9; }
  .card-flag{
    position:absolute;
    top:5px; left:5px;
    background:var(--green);
    color:#fff;
    font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    font-size:8px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:2px 5px;
    border-radius:4px;
  }
  .card-body{ padding:7px 9px 8px; }
  .card-title{
    font-size:11px;
    font-weight:600;
    line-height:1.3;
    margin:0 0 4px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-meta{
    font-size:9px;
    color:var(--red);
    font-weight:600;
    display:flex;
    gap:5px;
    align-items:center;
  }
  .card-src{
    color:var(--ink-soft);
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  @keyframes tile-in{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .status{
    font-size:11.5px;
    color:var(--ink-soft);
    padding:10px 2px;
    text-align:center;
  }

  .skeleton{
    border-radius:8px;
    background:linear-gradient(100deg, var(--panel) 30%, #f2e4e6 50%, var(--panel) 70%);
    background-size:220% 100%;
    animation:shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ background-position:120% 0; }
    100%{ background-position:-20% 0; }
  }
  @media (prefers-reduced-motion:reduce){
    .skeleton{ animation:none; }
    .refresh.spin svg{ animation:none; }
    a.card{ opacity:1; animation:none; }
    .hero-img{ transition:none; }
    .hero-slide.active .hero-img{ transform:none; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="head">
    <div>
      <p class="label"><span class="dot"></span>Oil &amp; Gas News — Daily Edition</p>
      <p class="stamp" id="stamp">Loading…</p>
    </div>
    <div class="head-right">
      <a class="mogsc-link" href="https://mogsc.org/" target="_blank" rel="noopener" title="Malaysian Oil, Gas &amp; Energy Services Council">MOGSC</a>
      <button class="refresh" id="refreshBtn" title="Refresh now" aria-label="Refresh now">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <div class="scroll" id="scroll">
    <div class="skeleton" style="height:150px"></div>
    <div class="skeleton" style="height:14px; width:40%"></div>
    <div class="grid">
      <div class="skeleton" style="height:112px"></div>
      <div class="skeleton" style="height:112px"></div>
      <div class="skeleton" style="height:112px"></div>
      <div class="skeleton" style="height:112px"></div>
    </div>
  </div>
</div>

<script>
(function(){
  /* ===========================================================
     SOURCES — oil, gas & energy trade press.

     NOTE ON MOGSC: mogsc.org has NO RSS feed. Its "Latest News"
     block is a hand-maintained Slider Revolution carousel that
     links out to The Edge / Upstream and goes stale for months
     at a time, so it cannot be automated. We pull the same trade
     sources MOGSC itself curates from, and keep a permanent
     MOGSC link in the header.

     Feeds that 404 or block the proxy are skipped silently, so
     it is safe to add/remove entries here. Comment one out if
     Corp Comm objects to a particular masthead.
  =========================================================== */
  var FEEDS = [
    { name: 'OilPrice',          url: 'https://oilprice.com/rss/main' },
    { name: 'Offshore Energy',   url: 'https://www.offshore-energy.biz/feed/' },
    { name: 'Energy Voice',      url: 'https://www.energyvoice.com/feed/' },
    { name: 'World Oil',         url: 'https://worldoil.com/rss?feed=news' },
    { name: 'Oil & Gas Journal', url: 'https://www.ogj.com/__rss/website-scheduled-content.xml' },
    { name: 'NST Business',      url: 'https://www.nst.com.my/business/rss' }
  ];

  /* ---------- regional relevance scoring ----------
     Weighted, not just a yes/no match. Highest-scoring stories
     take the hero slots; everything else drops into the grid.  */
  var TIER_A = [   // Malaysia + our own backyard — weight 5
    'malaysia','malaysian','petronas','petroliam nasional','carigali',
    'sarawak','sabah','labuan','bintulu','kerteh','miri','terengganu',
    'kimanis','mogsc','ogse','petros','petra energy','penergy'
  ];
  var TIER_B = [   // Malaysian-listed OGSE names — weight 4
    'sapura energy','sapuraomv','dialog group','yinson','velesto',
    'bumi armada','mmhe','malaysia marine and heavy','hibiscus',
    'wasco','deleum','uzma','dayang','coastal contracts','perdana petroleum',
    'icon offshore','t7 global','keyfield','malaysian bulk'
  ];
  var TIER_C = [   // wider ASEAN / regional context — weight 2
    'asean','south china sea','indonesia','pertamina','vietnam','petrovietnam',
    'thailand','pttep','brunei','philippines','singapore','myanmar','timor'
  ];

  function reFor(list){ return new RegExp('\\b(' + list.join('|') + ')', 'i'); }
  var RE_A = reFor(TIER_A), RE_B = reFor(TIER_B), RE_C = reFor(TIER_C);

  function scoreOf(item){
    var hay = (item.title || '') + ' ' + (item.description || '').slice(0, 500);
    var s = 0;
    if (RE_A.test(hay)) s += 5;
    if (RE_B.test(hay)) s += 4;
    if (RE_C.test(hay)) s += 2;
    // a hit in the headline itself matters more than one buried in the blurb
    if (s && (RE_A.test(item.title || '') || RE_B.test(item.title || ''))) s += 3;
    return s;
  }

  var PROXY  = 'https://api.rss2json.com/v1/api.json?rss_url=';
  var CACHE_KEY = 'penergy-og-edition';
  var ROLLOVER_HOUR = 7;          // new edition publishes at 07:00 local

  var scroll = document.getElementById('scroll');
  var refreshBtn = document.getElementById('refreshBtn');
  var stampEl = document.getElementById('stamp');
  var heroTimer = null;
  var editionTimer = null;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- daily edition clock ---------- */
  function editionDate(){
    var d = new Date();
    if (d.getHours() < ROLLOVER_HOUR) d.setDate(d.getDate() - 1);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function editionKey(){
    var d = editionDate();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function editionLabel(){
    return editionDate().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }
  function msUntilRollover(){
    var next = new Date();
    next.setHours(ROLLOVER_HOUR, 0, 5, 0);      // +5s cushion past the hour
    if (next <= new Date()) next.setDate(next.getDate() + 1);
    return next - new Date();
  }
  function scheduleRollover(){
    clearTimeout(editionTimer);
    editionTimer = setTimeout(function(){
      load(true);                  // force-fetch the new day's edition
      scheduleRollover();
    }, msUntilRollover());
  }

  /* ---------- cache ---------- */
  function readCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && obj.key === editionKey() && obj.items && obj.items.length) ? obj : null;
    }catch(e){ return null; }
  }
  function writeCache(items){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({ key: editionKey(), items: items }));
    }catch(e){ /* private mode / quota — no cache, still renders live */ }
  }

  function timeAgo(dateStr){
    var diff = Date.now() - new Date(dateStr).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  /* ================= HD IMAGE PIPELINE =================
     RSS feeds hand us whatever size the CMS felt like. Three
     things fix the soft/pixelated look:
       1. strip WordPress "-1024x718" style size suffixes to get
          back to the original upload
       2. strip / raise resize query params (?w=, ?resize=, ?fit=)
       3. keep every candidate and try them in order, falling
          back the moment one 404s
  ==================================================== */
  function hdVariants(url){
    if (!url) return [];
    var out = [];
    var clean = url.replace(/^http:\/\//i, 'https://');

    // Photon / Jetpack CDN — just ask for a big one
    if (/i\d\.wp\.com|\.files\.wordpress\.com/i.test(clean)){
      out.push(clean.split('?')[0] + '?w=1600&quality=92');
    }
    // drop resize/crop query strings entirely
    var noQuery = clean.split('?')[0];
    // WordPress thumbnail suffix: image-1024x718.jpg -> image.jpg
    var noSuffix = noQuery.replace(/-\d{2,4}x\d{2,4}(?=\.(jpe?g|png|webp|avif)$)/i, '');
    // some CMSes embed /w_640/ or /resize/640x/ path segments
    var noPathSize = noSuffix
      .replace(/\/(w|h)_\d+([,/])/gi, '/')
      .replace(/\/resize\/\d+x\d*\//gi, '/')
      .replace(/\/thumbs?\//gi, '/');

    [noPathSize, noSuffix, noQuery, clean].forEach(function(u){
      if (u && out.indexOf(u) === -1) out.push(u);
    });
    return out;
  }

  function widthHint(url){
    var m = url.match(/(\d{3,4})x(\d{3,4})/) || url.match(/[?&]w=(\d{3,4})/);
    return m ? parseInt(m[1], 10) : 0;
  }

  function imageCandidates(item){
    var html = item.content || item.description || '';
    var skip = /(icon|logo|avatar|pixel|1x1|spacer|tracking|gravatar|feedburner)/i;
    var raw = [];

    // every <img> in the body, biggest-looking first
    var tags = html.match(/<img[^>]+>/gi) || [];
    tags.forEach(function(tag){
      // srcset gives us the full ladder — take its largest entry
      var ss = tag.match(/srcset=["']([^"']+)["']/i);
      if (ss){
        ss[1].split(',').forEach(function(part){
          var u = part.trim().split(/\s+/)[0];
          if (u && !skip.test(u)) raw.push(u);
        });
      }
      var src = tag.match(/src=["']([^"']+)["']/i);
      if (src && !skip.test(src[1])) raw.push(src[1]);
    });

    // feed-level image fields as backup
    if (item.enclosure && item.enclosure.link) raw.push(item.enclosure.link);
    if (item.thumbnail) raw.push(item.thumbnail);

    // last resort: anything we skipped earlier
    if (!raw.length){
      tags.forEach(function(tag){
        var src = tag.match(/src=["']([^"']+)["']/i);
        if (src) raw.push(src[1]);
      });
    }

    raw.sort(function(a, b){ return widthHint(b) - widthHint(a); });

    var out = [];
    raw.forEach(function(u){
      hdVariants(u).forEach(function(v){
        if (out.indexOf(v) === -1) out.push(v);
      });
    });
    return out.slice(0, 8);
  }

  // walk the candidate list until one actually loads
  function paintImage(el, candidates){
    if (!candidates || !candidates.length) return;
    var i = 0;
    (function tryNext(){
      if (i >= candidates.length) return;
      var url = candidates[i++];
      var probe = new Image();
      probe.onload = function(){
        // reject tiny decoys that slipped through
        if (probe.naturalWidth < 200 && i < candidates.length) return tryNext();
        el.style.backgroundImage = 'url("' + url + '")';
      };
      probe.onerror = tryNext;
      probe.referrerPolicy = 'no-referrer';
      probe.src = url;
    })();
  }

  /* ---------- rendering ---------- */
  function buildHero(items){
    var hero = document.createElement('div');
    hero.className = 'hero';

    items.forEach(function(item, i){
      var slide = document.createElement('a');
      slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
      slide.href = item.link;
      slide.target = '_blank';
      slide.rel = 'noopener';

      var imgEl = document.createElement('div');
      imgEl.className = 'hero-img';
      paintImage(imgEl, item._imgs);
      slide.appendChild(imgEl);

      var tag = document.createElement('span');
      tag.className = 'hero-tag' + (item._score >= 5 ? ' local' : '');
      tag.textContent = item._score >= 5 ? 'Malaysia / Region'
                      : item._score > 0   ? 'Regional'
                      : (item._source || 'Industry');
      slide.appendChild(tag);

      var body = document.createElement('div');
      body.className = 'hero-body';
      var title = document.createElement('p');
      title.className = 'hero-title';
      title.textContent = item.title;
      var meta = document.createElement('div');
      meta.className = 'hero-meta';
      meta.textContent = (item._source || 'Industry press') + ' · ' + timeAgo(item.pubDate);
      body.appendChild(title);
      body.appendChild(meta);
      slide.appendChild(body);

      hero.appendChild(slide);
    });

    var dots = document.createElement('div');
    dots.className = 'hero-dots';
    items.forEach(function(item, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = i === 0 ? 'active' : '';
      b.setAttribute('aria-label', 'Show story ' + (i + 1));
      b.addEventListener('click', function(){ goToSlide(hero, i); });
      dots.appendChild(b);
    });
    hero.appendChild(dots);

    if (!reduced){
      hero.addEventListener('mouseenter', function(){ clearInterval(heroTimer); });
      hero.addEventListener('mouseleave', function(){ startAutoRotate(hero, items.length); });
      startAutoRotate(hero, items.length);
    }
    return hero;
  }

  function goToSlide(hero, index){
    var slides = hero.querySelectorAll('.hero-slide');
    var dots = hero.querySelectorAll('.hero-dots button');
    slides.forEach(function(s, i){ s.classList.toggle('active', i === index); });
    dots.forEach(function(d, i){ d.classList.toggle('active', i === index); });
    hero.dataset.current = index;
  }

  function startAutoRotate(hero, count){
    clearInterval(heroTimer);
    if (count < 2) return;
    heroTimer = setInterval(function(){
      var current = parseInt(hero.dataset.current || '0', 10);
      goToSlide(hero, (current + 1) % count);
    }, 5500);
  }

  function buildCard(item, index){
    var a = document.createElement('a');
    a.className = 'card';
    a.style.setProperty('--i', index);
    a.href = item.link;
    a.target = '_blank';
    a.rel = 'noopener';

    var imgWrap = document.createElement('div');
    imgWrap.className = 'card-img';
    if (item._imgs && item._imgs.length){
      paintImage(imgWrap, item._imgs);
    } else {
      imgWrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 21V9l5-3v3l5-3v4h6v11" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 21h20" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>';
    }
    if (item._score >= 5){
      var flag = document.createElement('span');
      flag.className = 'card-flag';
      flag.textContent = 'MY';
      imgWrap.appendChild(flag);
    }

    var body = document.createElement('div');
    body.className = 'card-body';
    var title = document.createElement('p');
    title.className = 'card-title';
    title.textContent = item.title;
    var meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.appendChild(document.createTextNode(timeAgo(item.pubDate)));
    if (item._source){
      var src = document.createElement('span');
      src.className = 'card-src';
      src.textContent = '· ' + item._source;
      meta.appendChild(src);
    }
    body.appendChild(title);
    body.appendChild(meta);

    a.appendChild(imgWrap);
    a.appendChild(body);
    return a;
  }

  function render(items){
    scroll.innerHTML = '';
    if (!items.length) return;
    clearInterval(heroTimer);

    scroll.appendChild(buildHero(items.slice(0, 3)));

    var sub = document.createElement('p');
    sub.className = 'sub-label';
    sub.textContent = 'More industry news';
    scroll.appendChild(sub);

    var grid = document.createElement('div');
    grid.className = 'grid';
    items.slice(3, 9).forEach(function(item, i){
      grid.appendChild(buildCard(item, i));
    });
    scroll.appendChild(grid);

    var myCount = items.filter(function(i){ return i._score >= 5; }).length;
    stampEl.textContent = 'Edition ' + editionLabel() +
      (myCount ? ' · ' + myCount + ' Malaysia stor' + (myCount === 1 ? 'y' : 'ies') : '');
  }

  function showStatus(msg){
    clearInterval(heroTimer);
    scroll.innerHTML = '<div class="status">' + msg + '</div>';
    stampEl.textContent = 'Edition ' + editionLabel();
  }

  /* ---------- load ---------- */
  function load(force){
    // Same edition already built today? Serve it — the panel stays
    // stable all day and only turns over at 07:00.
    if (!force){
      var cached = readCache();
      if (cached){ render(cached.items); return; }
    }

    refreshBtn.classList.add('spin');

    Promise.all(
      FEEDS.map(function(feed){
        return fetch(PROXY + encodeURIComponent(feed.url) + '&_cb=' + Date.now(), { cache: 'no-store' })
          .then(function(res){ return res.ok ? res.json() : null; })
          .then(function(data){
            if (!data || data.status !== 'ok' || !Array.isArray(data.items)) return [];
            return data.items.map(function(item){
              item._source = feed.name;
              return item;
            });
          })
          .catch(function(){ return []; });
      })
    ).then(function(lists){
      var items = [];
      lists.forEach(function(list){ items = items.concat(list); });
      if (!items.length) throw new Error('empty');

      var seen = {};
      items = items.filter(function(item){
        if (!item.link || !item.title || seen[item.link]) return false;
        seen[item.link] = true;
        return true;
      });

      items.sort(function(a, b){ return new Date(b.pubDate) - new Date(a.pubDate); });

      // Only consider the last 3 days so nothing stale can be
      // promoted just because it mentions Petronas.
      var cutoff = Date.now() - 3 * 864e5;
      var fresh = items.filter(function(i){ return new Date(i.pubDate).getTime() > cutoff; });
      if (fresh.length < 9) fresh = items.slice(0, 30);

      var slim = fresh.slice(0, 40).map(function(item){
        return {
          title: item.title,
          link: item.link,
          pubDate: item.pubDate,
          _source: item._source,
          _score: scoreOf(item),
          _imgs: imageCandidates(item)
        };
      });

      // regional relevance first, recency as the tiebreaker
      slim.sort(function(a, b){
        if (b._score !== a._score) return b._score - a._score;
        return new Date(b.pubDate) - new Date(a.pubDate);
      });

      var top = slim.slice(0, 9);
      writeCache(top);
      render(top);
    }).catch(function(){
      var stale = null;
      try{
        var raw = localStorage.getItem(CACHE_KEY);
        stale = raw ? JSON.parse(raw) : null;
      }catch(e){}
      if (stale && stale.items && stale.items.length){
        render(stale.items);       // yesterday's edition beats an error box
      } else {
        showStatus('Couldn\u2019t load the latest industry news right now \u2014 try the refresh button, or check back later.');
      }
    }).finally(function(){
      setTimeout(function(){ refreshBtn.classList.remove('spin'); }, 500);
    });
  }

  // manual refresh always forces a live fetch
  refreshBtn.addEventListener('click', function(){ load(true); });

  // if the tab sat open past 07:00, catch up on focus
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && !readCache()) load(true);
  });

  load(false);
  scheduleRollover();
})();
</script>
</body>
