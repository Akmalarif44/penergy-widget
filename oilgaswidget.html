<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOGSC News Carousel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;overflow:hidden;}
  body{
    font-family:"Segoe UI","Segoe UI Web (West European)",Segoe,
                -apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- FRAME ---------- */
  .car{position:relative;width:100%;height:100%;overflow:hidden;background:#1b1b1b;}

  .track{display:flex;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);}
  @media (prefers-reduced-motion:reduce){.track{transition:none;}}

  .slide{
    min-width:100%;flex-shrink:0;height:100%;position:relative;
    display:block;text-decoration:none;color:inherit;
  }
  .slide img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
  .slide::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,
      rgba(0,0,0,.88) 0%,
      rgba(0,0,0,.62) 22%,
      rgba(0,0,0,.18) 48%,
      rgba(0,0,0,0) 72%);
  }

  /* ---------- CAPTION ---------- */
  .cap{
    position:absolute;left:32px;right:32px;bottom:50px;z-index:2;
    max-width:72%;color:#fff;pointer-events:none;
  }
  .cap h2{
    font-size:28px;font-weight:600;line-height:1.28;letter-spacing:-.01em;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cap .meta{
    margin-top:10px;font-size:13px;font-weight:400;
    color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.4);
  }

  /* ---------- ARROWS (SharePoint style) ---------- */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:40px;height:40px;border:none;border-radius:50%;
    background:rgba(0,0,0,.45);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s ease,background .15s ease;
  }
  .car:hover .nav,.nav:focus-visible{opacity:1;}
  .nav:hover{background:rgba(0,0,0,.72);}
  .nav:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .nav.prev{left:16px;} .nav.next{right:16px;}
  .nav svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;
           stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- DOTS ---------- */
  .dots{
    position:absolute;left:0;right:0;bottom:16px;z-index:3;
    display:flex;justify-content:center;align-items:center;gap:8px;
  }
  .dot{
    width:8px;height:8px;padding:0;border:none;border-radius:50%;
    background:rgba(255,255,255,.45);cursor:pointer;
    transition:background .15s ease,transform .15s ease;
  }
  .dot:hover{background:rgba(255,255,255,.85);}
  .dot.active{background:#fff;transform:scale(1.3);}
  .dot:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  /* ---------- MOBILE ---------- */
  @media (max-width:640px){
    .cap{left:20px;right:20px;bottom:42px;max-width:100%;}
    .cap h2{font-size:18px;}
    .cap .meta{font-size:11px;margin-top:6px;}
    .nav{width:32px;height:32px;opacity:1;}
    .nav.prev{left:8px;} .nav.next{right:8px;}
    .dot{width:6px;height:6px;}
  }
</style>
</head>
<body>

<div class="car" id="car" role="region" aria-roledescription="carousel" aria-label="Malaysia O&amp;G and MOGSC news">
  <div class="track" id="track" aria-live="polite"></div>

  <button class="nav prev" id="prev" aria-label="Previous news">
    <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
  </button>
  <button class="nav next" id="next" aria-label="Next news">
    <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
  </button>

  <div class="dots" id="dots" role="tablist" aria-label="Choose news item"></div>
</div>

<script>
/* =====================================================================
   CONTENT — edit here. daysAgo controls the "2d ago" text automatically.
   ===================================================================== */
var DAY = 86400000;
var ITEMS = [
  {title:'MOGSC 2026 — Malaysia O&G Services Sector Outlook',
   source:'MOGSC', daysAgo:0, link:'https://www.mogsc.org',
   img:'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1600&q=80'},

  {title:'PETRONAS Awards New Upstream Contracts in Malaysia',
   source:'PETRONAS', daysAgo:1, link:'https://www.petronas.com/media/press-release',
   img:'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600&q=80'},

  {title:'Malaysia Oil & Gas Sector Targets RM 30B Revenue in 2026',
   source:'MOGSC', daysAgo:2, link:'https://www.mogsc.org',
   img:'https://images.unsplash.com/photo-1586953208448-b95a79798f07?w=1600&q=80'},

  {title:'MUPEX 2026 — Upstream Petroleum Exhibition Preview',
   source:'MUPEX', daysAgo:3, link:'https://www.mupex.com.my',
   img:'https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=1600&q=80'},

  {title:'OGA 2026 Conference Highlights Malaysia Energy Transition',
   source:'OGA', daysAgo:4, link:'https://www.ogashow.com',
   img:'https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?w=1600&q=80'},

  {title:'Malaysian Oil Services Companies Report Strong Q2 2026 Results',
   source:'Bursa Malaysia', daysAgo:5, link:'https://www.bursamalaysia.com',
   img:'https://images.unsplash.com/photo-1497435334941-8c899ee9e8e9?w=1600&q=80'},

  {title:'Sarawak Onshore Production Milestone — AKW First Oil Achieved',
   source:'Upstream', daysAgo:6, link:'https://www.petronas.com',
   img:'https://images.unsplash.com/photo-1581091226033-d5c48150dbaa?w=1600&q=80'},

  {title:'Malaysia Advances Renewable Energy Integration in Offshore Operations',
   source:'MOGSC', daysAgo:7, link:'https://www.mogsc.org',
   img:'https://images.unsplash.com/photo-1545259741-2ea3ebf61fa3?w=1600&q=80'},

  {title:'Asia Pacific LNG Demand Growth Supports Malaysia Upstream Investment',
   source:'PETRONAS', daysAgo:8, link:'https://www.petronas.com',
   img:'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1600&q=80'},

  {title:'PETRONAS Carigali Expands HUC Contracts for Malaysia Shelf Projects',
   source:'PETRONAS', daysAgo:9, link:'https://www.petronas.com/media/press-release',
   img:'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600&q=80'}
];

var AUTOPLAY_MS = 6000;   /* set 0 to switch autoplay off */
var FALLBACK_IMG = 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1600&q=80';

/* =====================================================================
   ENGINE
   ===================================================================== */
var track = document.getElementById('track');
var dotsEl = document.getElementById('dots');
var car = document.getElementById('car');
var idx = 0, timer = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function timeAgo(days){
  if(days <= 0) return 'Just now';
  if(days === 1) return 'Yesterday';
  if(days < 7) return days + 'd ago';
  var w = Math.floor(days/7);
  return w + (w === 1 ? 'w ago' : 'w ago');
}

track.innerHTML = ITEMS.map(function(it,i){
  return '<a class="slide" href="' + esc(it.link || '#') + '" target="_blank" rel="noopener" '
       + 'role="group" aria-roledescription="slide" aria-label="' + (i+1) + ' of ' + ITEMS.length + '">'
       +   '<img src="' + esc(it.img) + '" alt="" loading="' + (i ? 'lazy' : 'eager') + '" '
       +        'onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">'
       +   '<div class="cap">'
       +     '<h2>' + esc(it.title) + '</h2>'
       +     '<div class="meta">' + esc(it.source) + ' &nbsp;·&nbsp; ' + timeAgo(it.daysAgo) + '</div>'
       +   '</div>'
       + '</a>';
}).join('');

dotsEl.innerHTML = ITEMS.map(function(_,i){
  return '<button class="dot' + (i===0 ? ' active' : '') + '" role="tab" '
       + 'aria-label="News ' + (i+1) + '" data-i="' + i + '"></button>';
}).join('');

var dots = [].slice.call(dotsEl.children);

function goTo(n){
  idx = (n + ITEMS.length) % ITEMS.length;
  track.style.transform = 'translateX(-' + (idx * 100) + '%)';
  dots.forEach(function(d,i){
    d.classList.toggle('active', i === idx);
    d.setAttribute('aria-selected', i === idx ? 'true' : 'false');
  });
}

function move(dir){ goTo(idx + dir); restart(); }

dotsEl.addEventListener('click', function(e){
  var b = e.target.closest('.dot');
  if(b){ goTo(+b.dataset.i); restart(); }
});
document.getElementById('prev').addEventListener('click', function(){ move(-1); });
document.getElementById('next').addEventListener('click', function(){ move(1); });

function start(){
  if(!AUTOPLAY_MS || ITEMS.length < 2) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  timer = setInterval(function(){ goTo(idx + 1); }, AUTOPLAY_MS);
}
function stop(){ clearInterval(timer); timer = null; }
function restart(){ stop(); start(); }

car.addEventListener('mouseenter', stop);
car.addEventListener('mouseleave', start);
car.addEventListener('focusin', stop);
car.addEventListener('focusout', start);
document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });

car.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'ArrowLeft') move(-1);
});

/* swipe */
var x0 = null;
car.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; stop(); }, {passive:true});
car.addEventListener('touchend', function(e){
  if(x0 === null) return;
  var dx = e.changedTouches[0].clientX - x0;
  if(Math.abs(dx) > 45) goTo(idx + (dx < 0 ? 1 : -1));
  x0 = null; start();
}, {passive:true});

goTo(0);
start();
</script>
</body>
</html>
