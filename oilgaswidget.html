<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O&amp;G Trending News</title>
<!--
  ===================================================================
  O&G TRENDING NEWS  —  PETRA Energy employee portal widget
  ===================================================================
  Order   : fixed, newest story first. Add a new item at the TOP of
            POOL and it becomes the lead slide.
  Content : 10 real published stories with their real publication
            dates and links. Last content review: 30 July 2026.
  Photos  : Pexels (free licence). Every ID verified against its
            Pexels download URL.
  Credits : Aron Razif, Jakub Pabis, Matheus Bertelli, Lio Voo,
            Heru Dharma, Anoop VS.   pexels.com/license/
  ===================================================================
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;overflow:hidden;}
  body{
    font-family:"Segoe UI","Segoe UI Web (West European)",Segoe,
                -apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  :root{
    --max-width:760px;    /* narrower box. 100% = full width of the web part */
    --radius:8px;         /* 0 for hard corners */
    --inset:32px;
    --cap-bottom:58px;
    --dots-bottom:20px;
    --title:26px;
    /* FADE length only (one image dissolving into the next). The
       10-second gap between slides is SLIDE_MS in the script below. */
    --glide:.5s;
  }

  .wrap{max-width:var(--max-width);height:100%;margin:0 auto;}

  .car{
    position:relative;width:100%;height:100%;overflow:hidden;
    background:#0a1a20;
    border-radius:var(--radius);
    container-type:inline-size;   /* caption scales to the BOX, not the window */
  }

  .track{position:absolute;inset:0;}

  .slide{
    position:absolute;inset:0;
    display:block;text-decoration:none;color:inherit;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity var(--glide) ease-in-out,
               visibility var(--glide) ease-in-out;
  }
  .slide.is-active{opacity:1;visibility:visible;pointer-events:auto;}
  @media (prefers-reduced-motion:reduce){.slide{transition:none;}}

  .slide img{
    width:100%;height:100%;
    object-fit:cover;object-position:center;
    display:block;background:#0a1a20;
  }
  .slide::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,
      rgba(0,0,0,.88) 0%,
      rgba(0,0,0,.62) 26%,
      rgba(0,0,0,.18) 52%,
      rgba(0,0,0,0) 76%);
  }

  /* ---------- CAPTION ---------- */
  .cap{
    position:absolute;
    left:var(--inset);right:var(--inset);bottom:var(--cap-bottom);
    z-index:2;color:#fff;pointer-events:none;
    max-width:calc(100% - (var(--inset) * 2));
  }
  .cap h2{
    font-size:var(--title);font-weight:600;line-height:1.26;letter-spacing:-.012em;
    text-shadow:0 1px 4px rgba(0,0,0,.5);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cap .desc{
    margin-top:7px;font-size:13.5px;font-weight:400;line-height:1.45;
    color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.5);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cap .meta{
    margin-top:9px;font-size:12.5px;font-weight:400;line-height:1;
    color:rgba(255,255,255,.78);text-shadow:0 1px 2px rgba(0,0,0,.45);
  }
  .cap .meta .sep{margin:0 7px;opacity:.55;}

  @container (min-width:900px){ .cap{max-width:70%;} }

  /* ---------- ARROWS ---------- */
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:40px;height:40px;border:none;border-radius:50%;
    background:rgba(0,0,0,.45);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s ease,background .15s ease;
  }
  .car:hover .nav,.nav:focus-visible{opacity:1;}
  .nav:hover{background:rgba(0,0,0,.74);}
  .nav:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .nav.prev{left:20px;} .nav.next{right:20px;}
  .nav svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;
           stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- DOTS ---------- */
  .dots{
    position:absolute;left:0;right:0;bottom:var(--dots-bottom);z-index:3;
    display:flex;justify-content:center;align-items:center;gap:8px;
    height:8px;line-height:0;
  }
  .dot{
    width:8px;height:8px;padding:0;border:none;border-radius:50%;
    background:rgba(255,255,255,.42);cursor:pointer;flex:0 0 auto;
    transition:background .15s ease,transform .15s ease;
  }
  .dot:hover{background:rgba(255,255,255,.85);}
  .dot.active{background:#fff;transform:scale(1.3);}
  .dot:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  /* ---------- PAUSE / PLAY ---------- */
  .pp{
    position:absolute;right:16px;bottom:12px;z-index:4;
    width:26px;height:26px;
    border:none;border-radius:50%;
    background:rgba(0,0,0,.42);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:.72;transition:opacity .15s ease,background .15s ease;
  }
  .pp:hover{opacity:1;background:rgba(0,0,0,.72);}
  .pp:focus-visible{opacity:1;outline:2px solid #fff;outline-offset:2px;}
  .pp svg{width:11px;height:11px;fill:#fff;}
  .pp .ico-play{display:none;}
  .pp[aria-pressed="true"] .ico-pause{display:none;}
  .pp[aria-pressed="true"] .ico-play{display:block;}

  /* ---------- NARROW BOX / MOBILE ---------- */
  @container (max-width:720px){
    .cap{--inset:24px;bottom:54px;}
    .cap h2{font-size:21px;}
    .cap .desc{font-size:12.5px;}
  }
  @container (max-width:520px){
    .cap{--inset:18px;bottom:44px;}
    .cap h2{font-size:17px;}
    .cap .desc{display:none;}
    .cap .meta{font-size:11px;margin-top:6px;}
    .dots{bottom:16px;}
    .pp{width:22px;height:22px;right:10px;bottom:9px;}
    .pp svg{width:9px;height:9px;}
    .nav{width:32px;height:32px;opacity:1;}
    .nav.prev{left:8px;} .nav.next{right:8px;}
    .dot{width:6px;height:6px;}
  }

  @supports not (container-type:inline-size){
    @media (max-width:640px){
      .cap{--inset:18px;bottom:44px;}
      .cap h2{font-size:17px;}
      .cap .desc{display:none;}
      .nav{width:32px;height:32px;opacity:1;}
    }
  }
</style>
</head>
<body>

<div class="wrap">
<div class="car" id="car" role="region" aria-roledescription="carousel" aria-label="O&amp;G trending news">
  <div class="track" id="track" aria-live="polite"></div>

  <button class="nav prev" id="prev" aria-label="Previous news">
    <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
  </button>
  <button class="nav next" id="next" aria-label="Next news">
    <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
  </button>

  <div class="dots" id="dots" role="tablist" aria-label="Choose news item"></div>

  <button class="pp" id="playpause" aria-pressed="false" aria-label="Pause automatic rotation" title="Pause">
    <svg class="ico-pause" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" rx="1"/><rect x="7" y="1.5" width="3" height="9" rx="1"/></svg>
    <svg class="ico-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5 L10 6 L3 10.5 Z"/></svg>
  </button>
</div>
</div>

<script>
/* =====================================================================
   SETTINGS
   ===================================================================== */
var SLIDE_MS  = 10000;  /* 10 seconds per slide. 0 = manual only      */
var IMG_WIDTH = 1920;   /* HD. bump to 2560 for a large TV display    */

/* =====================================================================
   PEXELS URL BUILDER
   To swap a photo: open pexels.com, find one, OPEN THE PHOTO PAGE, and
   take the number at the end of the page URL.
       pexels.com/photo/oil-refinery-plant-15970032/  ->  15970032
   Do not take IDs from a search listing - they aren't always real.
   ===================================================================== */
function px(id, w){
  return 'https://images.pexels.com/photos/' + id + '/pexels-photo-' + id +
         '.jpeg?auto=compress&cs=tinysrgb&w=' + (w || IMG_WIDTH);
}
function pxPlain(id){
  return 'https://images.pexels.com/photos/' + id + '/pexels-photo-' + id + '.jpeg';
}

/* =====================================================================
   FALLBACK ARTWORK — shows only if the photo can't load (proxy block,
   Pexels down, bad ID). Keeps the slide looking finished either way.
   ===================================================================== */
var PALETTE = {
  teal:['#062229','#10454F'], navy:['#0D172B','#22304F'], red:['#2B0A0F','#661320'],
  slate:['#101416','#2A3136'], ocean:['#07202B','#0E3A46'], moss:['#0B211A','#164237']
};
var MOTIF = {
  derrick:'M100 26 L58 172 M100 26 L142 172 M70 132 H130 M78 102 H122 M86 72 H114 M46 172 H154 M100 26 V10',
  platform:'M22 118 H178 M22 118 L34 104 H166 L178 118 M42 118 V176 M158 118 V176 M74 118 V176 M126 118 V176 M22 176 H178 M104 104 V54 M88 54 H120 M104 54 L104 38',
  expo:'M24 60 H176 M24 60 V50 H176 V60 M40 60 V140 H88 V60 M112 60 V140 H160 V60 M24 168 H176 M52 92 H76 M136 92 H160 M52 116 H76 M136 116 H160',
  chart:'M28 172 H180 M42 172 V118 H70 V172 M84 172 V86 H112 V172 M126 172 V50 H154 V172 M28 172 V28',
  wellhead:'M100 18 V132 M84 132 H116 L100 178 Z M66 56 H134 M66 88 H134 M100 132 m-28 0 a28 28 0 1 0 56 0 M44 178 H156',
  tanker:'M24 112 H180 L160 154 H44 Z M100 112 V56 M100 56 H144 M56 112 V84 H84 V112 M118 112 V90 H144 V112 M12 166 H192 M32 166 Q50 158 68 166 T104 166 T140 166 T176 166',
  pipeline:'M12 82 H188 M12 130 H188 M46 74 V90 M96 74 V90 M146 74 V90 M46 122 V138 M96 122 V138 M146 122 V138 M96 90 V122 M96 106 m-16 0 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0 M96 90 V70',
  tank:'M40 70 H160 V166 H40 Z M40 96 H160 M40 122 H160 M40 148 H160 M56 70 V44 H144 V70 M100 44 V22 M24 176 H176'
};

function art(paletteName, motifName){
  var p = PALETTE[paletteName] || PALETTE.teal;
  var d = MOTIF[motifName] || MOTIF.derrick;
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + p[0] + '"/><stop offset="1" stop-color="' + p[1] + '"/>' +
      '</linearGradient>' +
      '<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">' +
        '<path d="M0 80 H80 M80 0 V80" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>' +
      '</pattern></defs>' +
      '<rect width="1600" height="900" fill="url(#g)"/>' +
      '<rect width="1600" height="900" fill="url(#grid)"/>' +
      '<circle cx="1290" cy="300" r="330" fill="#fff" fill-opacity=".035"/>' +
      '<g transform="translate(1010 150) scale(3.1)" fill="none" stroke="#fff" stroke-opacity=".30" ' +
         'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="' + d + '"/></g>' +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* =====================================================================
   NEWS POOL — NEWEST FIRST. Slide 1 is always the top entry here.
   To add a story: paste a new block at the top of this list and delete
   the oldest one at the bottom. Keep it to 10 so the dots stay tidy.
   Fields: title / desc / source / date (YYYY-MM-DD) / link / photo
   ===================================================================== */
var POOL = [
  {
    title:'Higher gas prices set to lift Gas Malaysia earnings 16% in FY27',
    desc:'RHB Research expects the Malaysia Reference Price to climb 28% next year, tracking this year\u2019s 21% rise in Brent with a nine-month lag.',
    source:'The Star', date:'2026-07-27',
    link:'https://www.thestar.com.my/business/business-news/2026/07/27/higher-prices-to-bolster-gas-malaysia-profit',
    photo:29708259, palette:'slate', motif:'chart'
  },
  {
    title:'Another PETRONAS tanker due in Melaka by early August',
    desc:'The Prime Minister said the vessel will sail from Yanbu, Saudi Arabia through the Red Sea after clearance was granted.',
    source:'The Star', date:'2026-07-24',
    link:'https://www.thestar.com.my/news/nation/2026/07/24/another-petronas-tanker-set-to-arrive-in-early-august-says-pm',
    photo:13178759, palette:'ocean', motif:'tanker'
  },
  {
    title:"PETRONAS signs LNG supply deal with Japan's Shizuoka Gas",
    desc:'PETRONAS LNG will supply about 0.84 million tonnes a year for seven years from 2032, extending a partnership of three decades.',
    source:'Rigzone', date:'2026-07-20',
    link:'https://www.rigzone.com/news/petronas_bags_new_contract_to_supply_lng_to_shizuoka_gas-20-jul-2026-184161-article/',
    photo:15893881, palette:'navy', motif:'tank'
  },
  {
    title:'Searah Malaysia assumes operatorship of five upstream assets',
    desc:'The PETRONAS\u2013Eni joint venture began operations on 1 July, taking over production sharing contracts from PETRONAS Carigali.',
    source:'AOG Digital', date:'2026-07-17',
    link:'https://aogdigital.com/news/541310-searah-malaysia-starts-upstream-oil-and-gas-operations',
    photo:9336590, palette:'ocean', motif:'platform'
  },
  {
    title:"Opinion: Malaysia's next O&G advantage will be physics-native AI",
    desc:'The Edge argues that Strait of Hormuz disruption has tied energy security directly to food and industrial supply costs, making resource optimisation a national priority.',
    source:'The Edge Malaysia', date:'2026-07-13',
    link:'https://www.klsescreener.com/v2/news/view/1757607/My_Say_Malaysia_s_next_oil_and_gas_advantage_will_be_physics_native_AI',
    photo:29708266, palette:'navy', motif:'expo'
  },
  {
    title:'Malaysia fuel supply secured to end-July amid Hormuz disruption',
    desc:'PETRONAS extended its assurance by a month as Brent averaged around US$111. Subsidised fuel quotas were trimmed and civil servants moved to work-from-home to conserve supply.',
    source:'OilPrice.com', date:'2026-05-25',
    link:'https://oilprice.com/Latest-Energy-News/World-News/Malaysia-Secures-Fuel-Supply-Through-End-of-July.html',
    photo:15970028, palette:'red', motif:'tank'
  },
  {
    title:'PETRA Energy resumes production at Banang oilfield',
    desc:'Production restarted in April after a 15-month pause for mandatory drydocking of the Petra Orion MOPU, offshore Terengganu.',
    source:'The Star', date:'2026-05-11',
    link:'https://www.thestar.com.my/business/business-news/2026/05/11/banang-oilfield-back-online-for-petra-energy',
    photo:36594202, palette:'teal', motif:'wellhead'
  },
  {
    title:'PETRA Energy wins two-year SK407 field operations contract',
    desc:'Awarded by Vestigo Petroleum to manage West Lutong, Baram, Tukau, Siwa and Fairly Baram fields off Miri, from April 2026 to March 2028.',
    source:'Business Today', date:'2026-04-24',
    link:'https://www.businesstoday.com.my/2026/04/24/petra-energy-secures-field-operations-contract-for-sk407-block-in-sarawak/',
    photo:9336586, palette:'teal', motif:'platform'
  },
  {
    title:'Petra Resources accepts RM298m Bintulu hook-up work orders',
    desc:'Four work orders from PETRONAS Carigali for hook-up and commissioning on Phase 2 of the Bintulu integrated facilities rejuvenation project.',
    source:'IndexBox', date:'2026-04-12',
    link:'https://www.indexbox.io/blog/petronas-carigali-awards-major-gas-project-work-to-petra-resources/',
    photo:15970032, palette:'red', motif:'pipeline'
  },
  {
    title:'PETRONAS launches Malaysia Bid Round 2026',
    desc:'Nine exploration blocks across the Sandakan, West Sarawak and Malay basins, plus six discovered resource opportunities ready for development.',
    source:'Offshore Energy', date:'2026-02-11',
    link:'https://www.offshore-energy.biz/malaysia-ups-its-energy-investment-ante-with-new-oil-gas-bid-round/',
    photo:15961091, palette:'ocean', motif:'derrick'
  }
];

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function shortDate(iso){
  var p = String(iso).split('-');
  if(p.length !== 3) return '';
  return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0];
}

/* =====================================================================
   ENGINE
   ===================================================================== */
var track  = document.getElementById('track');
var dotsEl = document.getElementById('dots');
var car    = document.getElementById('car');
var idx = 0, timer = null, dots = [], slides = [];
var userPaused = false;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* photo -> plain photo -> artwork */
function buildImage(it, eager){
  var img = document.createElement('img');
  img.alt = '';
  img.loading = eager ? 'eager' : 'lazy';
  var stage = 0;
  img.addEventListener('error', function(){
    stage++;
    if(stage === 1 && it.photo){ img.src = pxPlain(it.photo); return; }
    img.src = art(it.palette, it.motif);
  });
  img.src = it.photo ? px(it.photo) : art(it.palette, it.motif);
  return img;
}

function render(){
  stop();
  track.innerHTML = '';
  dotsEl.innerHTML = '';

  POOL.forEach(function(it,i){
    var a = document.createElement('a');
    a.className = 'slide';
    a.href = it.link || '#';
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('role','group');
    a.setAttribute('aria-roledescription','slide');
    a.setAttribute('aria-label', (i+1) + ' of ' + POOL.length);

    var cap = document.createElement('div');
    cap.className = 'cap';
    cap.innerHTML =
      '<h2>' + esc(it.title) + '</h2>' +
      (it.desc ? '<div class="desc">' + esc(it.desc) + '</div>' : '') +
      '<div class="meta">' + esc(it.source) +
        '<span class="sep">&middot;</span>' + shortDate(it.date) + '</div>';

    a.appendChild(buildImage(it, i === 0));
    a.appendChild(cap);
    track.appendChild(a);

    var d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('role','tab');
    d.setAttribute('aria-label','News ' + (i+1));
    d.dataset.i = i;
    dotsEl.appendChild(d);
  });

  dots   = [].slice.call(dotsEl.children);
  slides = [].slice.call(track.children);
  idx = 0;
  if(slides[0]) slides[0].classList.add('is-active');
  goTo(0);
  start();
}

function goTo(n){
  var prev = idx;
  idx = (n + slides.length) % slides.length;
  if(slides[prev]) slides[prev].classList.remove('is-active');
  if(slides[idx])  slides[idx].classList.add('is-active');
  dots.forEach(function(d,i){
    d.classList.toggle('active', i === idx);
    d.setAttribute('aria-selected', i === idx ? 'true' : 'false');
  });
}
function move(dir){ goTo(idx + dir); restart(); }

function start(){
  if(userPaused) return;                    /* manual pause wins over hover */
  if(!SLIDE_MS || slides.length < 2) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  timer = setInterval(function(){ goTo(idx + 1); }, SLIDE_MS);
}
function stop(){ clearInterval(timer); timer = null; }
function restart(){ stop(); start(); }

var ppBtn = document.getElementById('playpause');
ppBtn.addEventListener('click', function(){
  userPaused = !userPaused;
  ppBtn.setAttribute('aria-pressed', userPaused ? 'true' : 'false');
  ppBtn.setAttribute('aria-label', userPaused ? 'Resume automatic rotation'
                                              : 'Pause automatic rotation');
  ppBtn.title = userPaused ? 'Play' : 'Pause';
  userPaused ? stop() : start();
});

dotsEl.addEventListener('click', function(e){
  var b = e.target.closest('.dot');
  if(b){ goTo(+b.dataset.i); restart(); }
});
document.getElementById('prev').addEventListener('click', function(){ move(-1); });
document.getElementById('next').addEventListener('click', function(){ move(1); });

/* ---------------------------------------------------------------------
   TOUCH / SWIPE
   Slides are <a> tags, so a swipe would otherwise also count as a tap
   and open the article. Track the gesture, only act on a clearly
   horizontal one, and swallow the click the browser fires afterwards.
   ------------------------------------------------------------------- */
var t0 = null, swiped = false;

car.addEventListener('touchstart', function(e){
  if(e.touches.length !== 1){ t0 = null; return; }
  t0 = {x:e.touches[0].clientX, y:e.touches[0].clientY};
  swiped = false;
  stop();
}, {passive:true});

car.addEventListener('touchend', function(e){
  if(!t0){ start(); return; }
  var dx = e.changedTouches[0].clientX - t0.x;
  var dy = e.changedTouches[0].clientY - t0.y;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5){
    swiped = true;
    goTo(idx + (dx < 0 ? 1 : -1));
  }
  t0 = null;
  start();
}, {passive:true});

car.addEventListener('touchcancel', function(){
  t0 = null; swiped = false; start();
}, {passive:true});

car.addEventListener('click', function(e){
  if(swiped){ e.preventDefault(); e.stopPropagation(); swiped = false; }
}, true);

/* hover-to-pause only where hover really exists - on a touch screen the
   emulated mouseenter would otherwise stop autoplay for good */
if(window.matchMedia('(hover: hover)').matches){
  car.addEventListener('mouseenter', stop);
  car.addEventListener('mouseleave', start);
}
car.addEventListener('focusin', stop);
car.addEventListener('focusout', start);
car.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'ArrowLeft')  move(-1);
});

document.addEventListener('visibilitychange', function(){
  document.hidden ? stop() : start();
});

render();
</script>
</body>
</html>
